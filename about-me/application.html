<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на учебный кружок Егорова Анастасия</title>
</head>
<body>
    <nav>
        <ul>
          <li><a href="index.html">Обо мне</a></li>
          <li><a href="hoddy.html">мои увлечения</a></li>
          <li><a href="colleg.html">мой коллежд</a></li>
          <li><a href="season.html">Сезон</a></li>
          <li><a href="samost.html">зима</a></li>
          <li><a href="schedule.html">Расписание</a></li>
          <li><a href="application.html">Заявка</a></li>
        </ul>
      </nav>

    <form action="application.html" method="get">
        <p>
            <label for="student">Учебное имя</label>
            <input id="student" name="student" type="text"
            minlength="2" required>
        </p>

        <p>
            <label for="email">Учебная почта</label>
            <input id="email" name="email" type="email"
            placeholder="temiko.udzumaki1010@gmail.com" required>
        </p>

        <p>
            <label for="photo">Телефон из 11 цифр</label>
            <input id="phone" name="phone" type="tel"
            pattern="[0-9]{11}" required
            aria-describedby="phone-help">
        <small id="phone-help">Без пробелов и знака +</small>
        </p>

        <p>
            <label for="date">Желаемая дата занятий</label>
            <input id="date" name="date" type="date" required>
        </p>
    
    <fieldset>
        <legend>формат занятий</legend>
        <p><input id="offline" type="radio" name="format"
        value="offline" required>
    <label for="offline">В коледже</label></p>

    <p><input id="online" type="radio" name="format"
        value="online" required>
    <label for="online">Дистанционно</label></p>
    </fieldset>
    <p>
        <label for="topic">Направление</label>
        <select id="topic" name="topic" required>
            <option value="">Выберете направление</option>
            <option value="HTML">HTML</option>
            <option value="Git">Git</option>
        </select>
    </p>

    <p>
        <input id="reminder" name="reminder" type="checkbox"
        value="yes">
        <label for="reminder">Добавить учебное напоминание</label>
    </p>

    <p>
        <label for="comment">Чему хотите науичтся</label>
        <textarea id="comment" name="comment" rows="4"
        maxlength="300" required></textarea>
    </p>
    <button type="submit">отправить свой учебный проект</button>
    <button type="reset">Сбросить поля</button>

</form>
</body>
</html>
